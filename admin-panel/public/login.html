<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lumi — Painel Administrativo | Dra. Aline Bentivegna</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/assets/style.css" />
</head>
<body class="tela-login">
  <main class="cartao-login">
    <div class="cartao-login__marca">Lumi <span>✨</span></div>
    <h1>Painel Administrativo</h1>
    <p class="texto-suave">Dra. Aline Bentivegna — acesso restrito à equipe</p>

    <form id="formLogin" class="form-login">
      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" autocomplete="current-password" required autofocus />
      <button type="submit">Entrar</button>
      <p id="erroLogin" class="texto-erro" hidden></p>
    </form>
  </main>

  <script src="/assets/login.js"></script>
</body>
</html>
